<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>連線統計</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<style>
  :root {
    --bg: #ffffff; --fg: #1f1f1f; --muted: #6b6b6b; --tile: #f4f3f0; --hover: #ecebe8;
    --accent: #2a78d6; --accent-soft: rgba(42, 120, 214, .14); --on-accent: #ffffff;
    --l0: #f0efec; --l1: #b7d3f6; --l2: #6da7ec; --l3: #2a78d6; --l4: #104281; --bar: #2a78d6;
    --sel: #1f1f1f;
    /* footprint: chain stores take categorical slot 1 (blue), own cafes slot 2 (orange) */
    --chain: #2a78d6; --own: #eb6834; --map-ring: #fcfcfb; --group: #6b6b6b;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202020; --fg: #f0f0f0; --muted: #a3a3a3; --tile: #2c2c2b; --hover: #333332;
      --accent: #3987e5; --accent-soft: rgba(57, 135, 229, .22);
      --l0: #383835; --l1: #184f95; --l2: #256abf; --l3: #3987e5; --l4: #86b6ef; --bar: #3987e5;
      --sel: #f0f0f0;
      --chain: #3987e5; --own: #d95926; --map-ring: #1a1a19; --group: #8a8a86;
    }
  }
  .views { margin-bottom: -6px; }
  #map { height: 430px; border-radius: 10px; overflow: hidden; background: var(--tile); }
  .map-note { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; z-index: 500; }
  .map-wrap { position: relative; }
  .key { display: flex; gap: 18px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .key .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .key .sizes { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; }
  .key .sizes i { display: inline-block; border-radius: 50%; border: 1.5px solid var(--muted); }
  .spots { max-height: 220px; overflow-y: auto; margin: 0 -8px; padding: 0 8px; }
  .spot { display: grid; grid-template-columns: 14px 1fr auto auto; gap: 10px; align-items: center; padding: 6px 8px; margin: 0 -8px; border-radius: 6px; cursor: pointer; }
  .spot:hover { background: var(--hover); }
  .spot .dot { width: 10px; height: 10px; border-radius: 50%; }
  .spot .where { color: var(--muted); font-size: 12px; margin-left: 8px; }
  .spot .days, .spot .time { color: var(--muted); font-variant-numeric: tabular-nums; }
  .spot .time { width: 100px; text-align: right; }
  .maplibregl-popup.cafe .maplibregl-popup-content {
    font: 13px/1.5 "Segoe UI", "Microsoft JhengHei UI", sans-serif; color: #1f1f1f; padding: 8px 10px; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  .maplibregl-popup.cafe b { font-size: 14px; }
  .maplibregl-popup.cafe .sub { color: #6b6b6b; }
  .maplibregl-ctrl-attrib { font-size: 11px; }
  @media (prefers-color-scheme: dark) {
    .maplibregl-ctrl-attrib.maplibregl-compact, .maplibregl-ctrl-attrib { background: rgba(32, 32, 32, .85); color: #a3a3a3; }
    .maplibregl-ctrl-attrib a { color: #c3c2b7; }
    .maplibregl-ctrl-attrib-button, .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: invert(1); }
    .maplibregl-ctrl-group { background: #2c2c2b; }
    .maplibregl-ctrl-group button + button { border-top-color: #3a3a38; }
    .maplibregl-popup.cafe .maplibregl-popup-content { background: #2c2c2b; color: #f0f0f0; }
    .maplibregl-popup.cafe .sub { color: #a3a3a3; }
    .maplibregl-popup-anchor-bottom.cafe .maplibregl-popup-tip { border-top-color: #2c2c2b; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 14px/1.45 "Segoe UI", "Microsoft JhengHei UI", "Microsoft JhengHei", sans-serif;
    padding: 24px; display: flex; gap: 20px; align-items: flex-start; user-select: none;
  }
  main { width: var(--grid-width, 760px); display: flex; flex-direction: column; gap: 22px; }
  h1 { font-size: 19px; font-weight: 600; margin: 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .small { font-size: 12px; padding: 2px 10px; border-radius: 6px; border: 1px solid var(--muted); background: transparent; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tile { background: var(--tile); border-radius: 8px; padding: 12px; }
  .tile .label { font-size: 12px; color: var(--muted); }
  .tile .value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grid-wrap { display: flex; flex-direction: column; gap: 6px; }
  .months { position: relative; height: 16px; font-size: 11px; color: var(--muted); margin-left: 26px; }
  .months span { position: absolute; top: 0; white-space: nowrap; }
  .grid-row { display: flex; gap: 6px; }
  .weekdays { display: grid; grid-template-rows: repeat(7, 11px); gap: 3px; font-size: 10px; color: var(--muted); width: 20px; }
  .weekdays span { line-height: 11px; }
  .grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 11px); grid-auto-columns: 11px; gap: 3px; outline: none; }
  .cell { width: 11px; height: 11px; border-radius: 2px; background: var(--l0); cursor: pointer; }
  .cell.l1 { background: var(--l1); } .cell.l2 { background: var(--l2); }
  .cell.l3 { background: var(--l3); } .cell.l4 { background: var(--l4); }
  .cell.out { visibility: hidden; }
  .cell.future { opacity: .35; cursor: default; }
  .cell.selected { outline: 2px solid var(--sel); outline-offset: 1px; }
  .below { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; min-height: 20px; }
  .caption { color: var(--muted); }
  .caption b { color: var(--fg); font-weight: 600; }
  .legend { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .legend .cell { cursor: default; }
  .segmented { display: inline-flex; background: var(--tile); border-radius: 8px; padding: 2px; align-self: flex-start; }
  .segmented button { border: 0; background: transparent; padding: 4px 16px; border-radius: 6px; }
  .segmented button.on { background: var(--bg); box-shadow: 0 1px 2px rgba(0,0,0,.18); font-weight: 600; }
  .bars { max-height: 182px; overflow-y: auto; margin: 0 -8px; padding: 0 8px; }
  .bar-row { display: flex; align-items: center; gap: 10px; padding: 5px 8px; margin: 0 -8px; border-radius: 6px; cursor: pointer; }
  .bar-row:hover { background: var(--hover); }
  .bar-row.selected { background: var(--accent-soft); }
  .bar-row .name { width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .track { flex: 1; height: 14px; overflow: hidden; }
  .bar-row .fill { height: 14px; border-radius: 3px; background: var(--bar); min-width: 2px; }
  .bar-row .time { width: 110px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); }
  .month-cols { display: flex; align-items: flex-end; height: 150px; }
  .month-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .month-col .peak { font-size: 11px; color: var(--muted); white-space: nowrap; min-height: 15px; }
  .month-col .col { width: 28px; border-radius: 3px; background: var(--bar); }
  .month-col .col.zero { background: var(--l0); }
  .month-col .m { font-size: 12px; color: var(--muted); }
  nav { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
  nav button { border: 0; background: transparent; text-align: left; width: 92px; padding: 6px 10px; border-radius: 6px; }
  nav button:hover { background: var(--hover); }
  nav button.on { background: var(--accent); color: var(--on-accent); }
</style>
</head>
<body>
<main>
  <div class="segmented views" id="views">
    <button data-view="stats" class="on">統計</button><button data-view="footprint">足跡</button>
  </div>
  <div id="footprint-view" style="display:none; flex-direction:column; gap:18px">
    <h1 id="fp-heading">咖啡廳足跡</h1>
    <div class="tiles" id="fp-tiles"></div>
    <div class="map-wrap">
      <div id="map" aria-label="咖啡廳足跡地圖"></div>
      <div class="map-note" id="map-note" hidden></div>
    </div>
    <div class="key">
      <span><span class="dot" style="background:var(--chain)"></span>連鎖咖啡廳</span>
      <span><span class="dot" style="background:var(--own)"></span>獨立咖啡廳</span>
      <span class="sizes">圓越大，待越久 <i style="width:8px;height:8px"></i><i style="width:14px;height:14px"></i><i style="width:22px;height:22px"></i></span>
    </div>
    <div class="spots" id="spots"></div>
  </div>
  <div id="stats-view" style="display:flex; flex-direction:column; gap:22px">
  <h1><span id="heading">連線統計</span><button id="all-stores" class="small" hidden>顯示全部門市</button></h1>
  <div class="tiles" id="tiles"></div>
  <div class="grid-wrap">
    <div class="months" id="months"></div>
    <div class="grid-row">
      <div class="weekdays"><span>一</span><span></span><span>三</span><span></span><span>五</span><span></span><span>日</span></div>
      <div class="grid" id="grid" tabindex="0" aria-label="每日連線時間"></div>
    </div>
    <div class="below">
      <span class="caption" id="caption"></span>
      <span class="legend">少 <span class="cell"></span><span class="cell l1"></span><span class="cell l2"></span><span class="cell l3"></span><span class="cell l4"></span> 多</span>
    </div>
  </div>
  <div class="segmented" id="tabs">
    <button data-tab="stores" class="on">門市</button><button data-tab="months">月份</button><button data-tab="years">年份</button>
  </div>
  <section id="breakdown"></section>
  </div>
</main>
<nav id="ranges"></nav>

<script>
"use strict";
const state = { view: "stats", range: "past", store: null, day: null, tab: "stores" };
let view = null;
let footprint = null;

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};
const duration = s => {
  const m = Math.floor(s / 60);
  return m >= 60 ? `${Math.floor(m / 60)} 小時 ${m % 60} 分` : `${m} 分`;
};
const monthDay = iso => { const [, m, d] = iso.split("-").map(Number); return `${m}月${d}日`; };

function request() {
  window.chrome.webview.postMessage({ view: state.view, range: state.range, store: state.store, day: state.day });
}

window.chrome.webview.addEventListener("message", e => {
  if (e.data.kind === "footprint") { footprint = e.data.data; renderFootprint(); }
  else { view = e.data.data; render(); }
});

function renderRanges(ranges, current) {
  $("ranges").replaceChildren(...ranges.map(r => {
    const b = el("button", r.id === current ? "on" : "", r.title);
    b.addEventListener("click", () => { state.range = r.id; state.day = null; request(); });
    return b;
  }));
}

function tiles(box, list) {
  box.replaceChildren(...list.map(t => {
    const d = el("div", "tile");
    const value = el("div", "value", t.value);
    value.title = t.value; // long store names are cut short
    d.append(el("div", "label", t.label), value);
    return d;
  }));
}

// MARK: footprint

let map = null, mapReady = false, popup = null, spotsById = {};
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const dark = window.matchMedia("(prefers-color-scheme: dark)");
const styleUrl = () => `https://tiles.openfreemap.org/styles/${dark.matches ? "dark" : "positron"}`;

function ensureMap() {
  if (map || !window.maplibregl) return map;
  map = new maplibregl.Map({ container: "map", style: styleUrl(), center: [121, 23.7], zoom: 2, attributionControl: { compact: true } });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-left");
  popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, className: "cafe", offset: 10 });
  map.on("style.load", () => { addLayers(); mapReady = true; drawSpots(); });
  dark.addEventListener("change", () => { mapReady = false; map.setStyle(styleUrl()); renderFootprint(); });
  return map;
}

/** Cafes as dots sized by time; nearby ones merge into a gray count bubble when zoomed out. */
function addLayers() {
  map.addSource("cafes", {
    type: "geojson", data: { type: "FeatureCollection", features: [] },
    cluster: true, clusterRadius: 36, clusterMaxZoom: 12,
    clusterProperties: { seconds: ["+", ["get", "seconds"]] },
  });
  map.addLayer({ id: "groups", type: "circle", source: "cafes", filter: ["has", "point_count"], paint: {
    "circle-color": css("--group"), "circle-opacity": 0.9,
    "circle-radius": ["interpolate", ["linear"], ["get", "point_count"], 2, 14, 20, 26],
    "circle-stroke-color": css("--map-ring"), "circle-stroke-width": 2,
  } });
  map.addLayer({ id: "group-count", type: "symbol", source: "cafes", filter: ["has", "point_count"], layout: {
    "text-field": ["get", "point_count_abbreviated"], "text-font": ["Noto Sans Bold"], "text-size": 13, "text-allow-overlap": true,
  }, paint: { "text-color": "#ffffff" } });
  map.addLayer({ id: "dots", type: "circle", source: "cafes", filter: ["!", ["has", "point_count"]], layout: {
    "circle-sort-key": ["-", 0, ["get", "seconds"]], // big dots underneath, small ones stay clickable
  }, paint: {
    "circle-color": ["match", ["get", "kind"], "own", css("--own"), css("--chain")],
    "circle-radius": ["get", "r"], "circle-opacity": 0.88,
    "circle-stroke-color": css("--map-ring"), "circle-stroke-width": 2,
  } });

  for (const id of ["dots", "groups"]) {
    map.on("mouseenter", id, () => { map.getCanvas().style.cursor = "pointer"; });
    map.on("mouseleave", id, () => { map.getCanvas().style.cursor = ""; popup.remove(); });
  }
  map.on("mousemove", "dots", e => {
    const s = spotsById[e.features[0].properties.id];
    if (s) popup.setLngLat([s.lng, s.lat]).setDOMContent(tip(s)).addTo(map);
  });
  map.on("mousemove", "groups", e => {
    const p = e.features[0].properties;
    const d = el("div");
    d.append(el("b", "", `${p.point_count} 家咖啡廳`), el("br"), document.createTextNode(`總共待了 ${duration(p.seconds)}`),
             el("br"), el("span", "sub", "點一下放大"));
    popup.setLngLat(e.features[0].geometry.coordinates).setDOMContent(d).addTo(map);
  });
  map.on("click", "groups", async e => {
    const f = e.features[0];
    const zoom = await map.getSource("cafes").getClusterExpansionZoom(f.properties.cluster_id);
    map.easeTo({ center: f.geometry.coordinates, zoom });
  });
}

function tip(s) {
  const d = el("div");
  d.append(el("b", "", s.label), el("br"));
  if (s.city) d.append(el("span", "sub", s.city + "・"));
  d.append(el("span", "sub", `去過 ${s.days} 天`), el("br"), document.createTextNode(`總共待了 ${s.text}`), el("br"),
           el("span", "sub", `最後一次：${s.lastVisit}`));
  return d;
}

function drawSpots() {
  const f = footprint;
  if (!f || !mapReady) return;
  const max = Math.max(1, ...f.spots.map(s => s.seconds));
  map.getSource("cafes").setData({ type: "FeatureCollection", features: f.spots.map(s => ({
    type: "Feature", geometry: { type: "Point", coordinates: [s.lng, s.lat] },
    // Radius from the square root, so a dot's area tracks time spent.
    properties: { id: s.id, kind: s.kind, seconds: s.seconds, r: 6 + 16 * Math.sqrt(s.seconds / max) },
  })) });
  if (f.spots.length === 0) {
    map.jumpTo({ center: [121, 23.7], zoom: 2 });
  } else if (f.spots.length === 1) {
    map.jumpTo({ center: [f.spots[0].lng, f.spots[0].lat], zoom: 14 });
  } else {
    const b = new maplibregl.LngLatBounds();
    f.spots.forEach(s => b.extend([s.lng, s.lat]));
    map.fitBounds(b, { padding: 60, maxZoom: 14, duration: 0 });
  }
}

function renderFootprint() {
  const f = footprint;
  if (!f) return;
  $("fp-heading").textContent = f.heading;
  tiles($("fp-tiles"), f.tiles);
  renderRanges(f.ranges, f.range);
  spotsById = Object.fromEntries(f.spots.map(s => [s.id, s]));

  const note = $("map-note");
  note.hidden = true;
  if (!ensureMap()) {
    note.textContent = "地圖需要網路連線才能顯示";
    note.hidden = false;
  } else {
    map.resize();
    drawSpots();
    if (f.spots.length === 0) {
      note.textContent = "這段期間還沒有足跡。連上咖啡廳的 Wi-Fi 之後，就會出現在這裡。";
      note.hidden = false;
    }
  }

  // The same data as a list: readable without the map or the colors.
  $("spots").replaceChildren(...f.spots.map(s => {
    const row = el("div", "spot");
    const dot = el("span", "dot");
    dot.style.background = `var(${s.kind === "own" ? "--own" : "--chain"})`;
    const name = el("span", "", s.label);
    if (s.city) name.append(el("span", "where", s.city));
    row.append(dot, name, el("span", "days", `${s.days} 天`), el("span", "time", s.text));
    row.addEventListener("click", () => {
      if (!map) return;
      map.flyTo({ center: [s.lng, s.lat], zoom: Math.max(map.getZoom(), 15), duration: 800 });
      map.once("moveend", () => popup.setLngLat([s.lng, s.lat]).setDOMContent(tip(s)).addTo(map));
    });
    return row;
  }));
  if (f.spots.length === 0) $("spots").replaceChildren(el("div", "empty", "還沒有紀錄。"));
}

/** "stats" or "footprint"; the app calls this too, to open straight onto the map. */
function showView(name) {
  state.view = name;
  for (const x of $("views").children) x.classList.toggle("on", x.dataset.view === name);
  $("stats-view").style.display = name === "stats" ? "flex" : "none";
  $("footprint-view").style.display = name === "footprint" ? "flex" : "none";
  state.day = null;
  request();
}
for (const b of $("views").children) b.addEventListener("click", () => showView(b.dataset.view));

function render() {
  const v = view;
  $("heading").textContent = v.heading;
  $("all-stores").hidden = !v.store;

  tiles($("tiles"), v.tiles);

  document.documentElement.style.setProperty("--grid-width", `${Math.max(640, 26 + v.weeks.length * 14)}px`);
  $("months").replaceChildren(...v.monthLabels.map(l => {
    const s = el("span", "", l.label);
    s.style.left = `${l.week * 14}px`;
    return s;
  }));

  const grid = $("grid");
  const cells = [];
  for (const week of v.weeks) {
    for (const c of week) {
      const d = el("div", "cell");
      if (!c.inRange) d.classList.add("out");
      else if (c.future) d.classList.add("future");
      else {
        if (c.level) d.classList.add("l" + c.level);
        d.title = `${monthDay(c.date)}：${c.seconds > 0 ? duration(c.seconds) : "無紀錄"}`;
        d.addEventListener("click", () => selectDay(c.date));
      }
      if (c.date === state.day) d.classList.add("selected");
      cells.push(d);
    }
  }
  grid.replaceChildren(...cells);

  const caption = $("caption");
  if (v.day) {
    caption.replaceChildren(el("b", "", v.day.title), document.createTextNode("　" + v.day.detail));
  } else {
    caption.textContent = "點選格子，查看當天的門市與連線時間";
  }

  for (const b of $("tabs").children) b.classList.toggle("on", b.dataset.tab === state.tab);
  renderBreakdown();

  renderRanges(v.ranges, v.range);
}

function bars(rows, selected, empty, onClick) {
  if (!rows.length) return el("div", "empty", empty);
  // Years arrive newest first, not longest first.
  const max = Math.max(...rows.map(r => r.seconds));
  const wrap = el("div", "bars");
  for (const r of rows) {
    const row = el("div", "bar-row" + (r.id === selected ? " selected" : ""));
    const track = el("div", "track"), fill = el("div", "fill");
    fill.style.width = `${(100 * r.seconds / max).toFixed(2)}%`;
    track.append(fill);
    const name = el("span", "name", r.label);
    name.title = r.label;
    row.append(name, track, el("span", "time", r.text));
    row.addEventListener("click", () => onClick(r.id));
    wrap.append(row);
  }
  return wrap;
}

function renderBreakdown() {
  const v = view, box = $("breakdown");
  if (state.tab === "stores") {
    box.replaceChildren(bars(v.stores, v.store, "這段期間沒有紀錄。連上咖啡廳 Wi-Fi 後會自動計時。", id => {
      state.store = state.store === id ? null : id;
      request();
    }));
  } else if (state.tab === "months") {
    const peak = Math.max(0, ...v.months.map(m => m.seconds));
    const cols = el("div", "month-cols");
    for (const m of v.months) {
      const c = el("div", "month-col");
      c.title = `${m.label}：${m.text}`;
      const bar = el("div", "col" + (m.seconds > 0 ? "" : " zero"));
      bar.style.height = `${peak > 0 ? Math.max(2, 110 * m.seconds / peak) : 2}px`;
      c.append(el("div", "peak", m.seconds === peak && peak > 0 ? m.text : ""), bar, el("div", "m", m.label));
      cols.append(c);
    }
    box.replaceChildren(cols);
  } else {
    const rows = v.years.map(y => ({ id: String(y.year), label: `${y.year} 年`, seconds: y.seconds, text: y.text }));
    box.replaceChildren(bars(rows, v.range, "還沒有紀錄。", id => { state.range = id; state.day = null; request(); }));
  }
}

function selectDay(date) {
  state.day = date;
  request();
}

$("all-stores").addEventListener("click", () => { state.store = null; request(); });
for (const b of $("tabs").children) b.addEventListener("click", () => { state.tab = b.dataset.tab; render(); });

// Arrow keys move the selected day: up/down a day, left/right a week (the grid's columns are weeks).
document.addEventListener("keydown", e => {
  const step = { ArrowUp: -1, ArrowDown: 1, ArrowLeft: -7, ArrowRight: 7 }[e.key];
  if (!step || !view || state.view !== "stats") return; // the map uses arrows to pan
  e.preventDefault();
  const days = view.weeks.flat().filter(c => c.inRange && !c.future).map(c => c.date);
  if (!days.length) return;
  let i = state.day ? days.indexOf(state.day) : -1;
  if (i < 0) { selectDay(days[days.length - 1]); return; }
  const date = new Date(state.day + "T00:00:00Z");
  date.setUTCDate(date.getUTCDate() + step);
  const next = date.toISOString().slice(0, 10);
  if (days.includes(next)) selectDay(next);
});

request();
</script>
</body>
</html>
